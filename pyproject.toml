[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "artifex"
version = "0.1.0"
description = "Production Agent Swarm with LangGraph + NATS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # LangGraph / LangChain
    "langgraph==0.2.28",
    "langchain==0.3.7",
    "langchain-groq==0.2.1",
    "langchain-community==0.3.7",

    # NATS
    "nats-py==2.7.2",

    # Temporal
    "temporalio==1.7.1",

    # FastAPI
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",

    # OpenAI (kept for optional use; embeddings handled by sentence-transformers)
    # "openai==1.54.4",

    # Vector DB
    "qdrant-client==1.12.0",

    # Redis
    "redis==5.2.0",

    # Observability
    "opentelemetry-api==1.28.1",
    "opentelemetry-sdk==1.28.1",
    "opentelemetry-instrumentation-fastapi==0.49b1",
    "opentelemetry-exporter-otlp-proto-grpc==1.28.1",
    "prometheus-client==0.21.0",

    # HTTP / utilities
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
    "sentence-transformers==3.3.0",

    # Web search
    "tavily-python==0.5.0",
    "duckduckgo-search==6.3.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "testcontainers==4.8.1",
    "httpx==0.27.2",
    "ruff==0.7.4",
    "mypy==1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
