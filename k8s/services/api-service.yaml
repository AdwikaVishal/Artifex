apiVersion: v1
kind: Service
metadata:
  name: artifex-api
  namespace: artifex
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: artifex-ingress
  namespace: artifex
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: artifex.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: artifex-api
                port:
                  number: 80
