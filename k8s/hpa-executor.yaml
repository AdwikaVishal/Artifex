apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: executor-hpa
  namespace: artifex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: executor
  minReplicas: 1
  maxReplicas: 10
  metrics:
    # Scale on NATS queue depth: add pods when avg pending messages per pod > 50.
    # Requires the Prometheus Adapter to expose nats_consumer_pending_msgs
    # as a custom metric (see k8s/prometheus-adapter-config.yaml).
    - type: Pods
      pods:
        metric:
          name: nats_consumer_pending_msgs
        target:
          type: AverageValue
          averageValue: "50"
    # Secondary: CPU-based scaling as a safety net
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30      # react quickly to load spikes
      policies:
        - type: Pods
          value: 2                         # add at most 2 pods per minute
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120     # wait 2 min before scaling down
      policies:
        - type: Pods
          value: 1                         # remove at most 1 pod per minute
          periodSeconds: 60
