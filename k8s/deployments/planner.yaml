apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner
  namespace: artifex
  labels:
    app: planner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: planner
  template:
    metadata:
      labels:
        app: planner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      containers:
        - name: planner
          image: artifex/planner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
              name: metrics
          envFrom:
            - configMapRef:
                name: artifex-config
            - secretRef:
                name: artifex-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 10
