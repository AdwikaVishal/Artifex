apiVersion: apps/v1
kind: Deployment
metadata:
  name: retriever
  namespace: artifex
  labels:
    app: retriever
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retriever
  template:
    metadata:
      labels:
        app: retriever
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
    spec:
      containers:
        - name: retriever
          image: artifex/retriever:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
              name: metrics
          envFrom:
            - configMapRef:
                name: artifex-config
            - secretRef:
                name: artifex-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 30
