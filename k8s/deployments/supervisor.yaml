apiVersion: apps/v1
kind: Deployment
metadata:
  name: supervisor
  namespace: artifex
  labels:
    app: supervisor
spec:
  replicas: 1   # singleton – only one supervisor needed
  selector:
    matchLabels:
      app: supervisor
  template:
    metadata:
      labels:
        app: supervisor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9095"
    spec:
      serviceAccountName: artifex-supervisor
      containers:
        - name: supervisor
          image: artifex/supervisor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9095
              name: metrics
          envFrom:
            - configMapRef:
                name: artifex-config
            - secretRef:
                name: artifex-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9095
            initialDelaySeconds: 15
            periodSeconds: 30
---
# ServiceAccount + RBAC so Supervisor can delete pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifex-supervisor
  namespace: artifex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-restarter
  namespace: artifex
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: supervisor-pod-restarter
  namespace: artifex
subjects:
  - kind: ServiceAccount
    name: artifex-supervisor
    namespace: artifex
roleRef:
  kind: Role
  name: pod-restarter
  apiGroup: rbac.authorization.k8s.io
