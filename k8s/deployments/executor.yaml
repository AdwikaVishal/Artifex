apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: artifex
  labels:
    app: executor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
    spec:
      containers:
        - name: executor
          image: artifex/executor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9093
              name: metrics
          envFrom:
            - configMapRef:
                name: artifex-config
            - secretRef:
                name: artifex-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9093
            initialDelaySeconds: 15
            periodSeconds: 30
