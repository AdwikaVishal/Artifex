global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: artifex-local

rule_files:
  - "alerts.yml"

scrape_configs:
  # OTel Collector (aggregated metrics)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Individual agent metrics (Docker Compose)
  - job_name: artifex-agents
    static_configs:
      - targets:
          - "planner:9091"
          - "retriever:9092"
          - "executor:9093"
          - "executor-a:9093"
          - "executor-b:9093"
          - "validator-a:9094"
          - "validator-b:9094"
          - "supervisor:9095"
          - "recovery:9096"
          - "foster-monitor:9097"
          - "dispatcher:9098"
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: agent
        replacement: "$1"

  # FastAPI
  - job_name: artifex-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # NATS
  - job_name: nats
    static_configs:
      - targets: ["nats:8222"]
    metrics_path: /metrics

  # Kubernetes pod discovery (production)
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [artifex]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
